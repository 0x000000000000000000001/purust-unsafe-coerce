package:
  name: unsafe-coerce
  dependencies: []

  test:
    main: Test.Runner
    dependencies:
      - assert
      - console
      - effect
      - foldable-traversable
      - prelude
      - refs

workspace:
  backend:
    cmd: ../purust/bin/purust
    args: [--main, Test.Runner, --source, output, --out, output/purust_output]
  packageSet:
    registry: 77.7.0
  extraPackages:
    assert:
      path: "../purust-assert"
    console:
      path: "../purust-console"
    effect:
      path: "../purust-effect"
    foldable-traversable:
      path: "../purust-foldable-traversable"
    partial:
      path: "../purust-partial"
    prelude:
      path: "../purust-prelude"
    refs:
      path: "../purust-refs"
